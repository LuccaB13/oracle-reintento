name: Reintentar servidor Oracle

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (GitHub puede demorarlo un poco)
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

concurrency:
  group: oracle-reintento
  cancel-in-progress: false

permissions:
  contents: read
  issues: write    # para avisarte con un "issue" (te llega un mail)
  actions: write   # para apagar el workflow solo cuando termina

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar llaves
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUB: ${{ secrets.SSH_PUB }}
        run: |
          if [ -z "$OCI_CONFIG" ] || [ -z "$OCI_KEY" ] || [ -z "$SSH_PUB" ]; then
            echo "Faltan los secrets OCI_CONFIG, OCI_KEY o SSH_PUB (ver README)."; exit 1
          fi
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CONFIG" | sed 's/\r$//' > ~/.oci/config
          printf '%s\n' "$OCI_KEY"    | sed 's/\r$//' > ~/.oci/api.pem
          printf '%s\n' "$SSH_PUB"    | sed 's/\r$//' > ~/clave.pub
          sed -i "s#^key_file=.*#key_file=$HOME/.oci/api.pem#" ~/.oci/config
          chmod 600 ~/.oci/config ~/.oci/api.pem

      - name: Intentar crear el servidor
        id: intento
        env:
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
        run: bash scripts/intentar.sh

      - name: Avisar y apagar el workflow
        if: steps.intento.outputs.resultado == 'creado' || steps.intento.outputs.resultado == 'existe'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ steps.intento.outputs.resultado }}
        run: |
          if [ "$RESULTADO" = "creado" ]; then
            gh issue create --title "Servidor lucca-server CREADO" \
              --body "Oracle tuvo capacidad y se creó lucca-server. Entrá a la consola: Compute → Instances para ver la IP pública."
          fi
          gh workflow disable "Reintentar servidor Oracle"
